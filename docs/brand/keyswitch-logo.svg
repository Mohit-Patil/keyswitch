<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">KeySwitch logo</title>
  <desc id="description">Two interlocking frosted keyboard layers surrounding a violet status light.</desc>
  <defs>
    <linearGradient id="shell" x1="170" y1="120" x2="850" y2="910" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#30333e"/>
      <stop offset="0.52" stop-color="#1c1e27"/>
      <stop offset="1" stop-color="#111218"/>
    </linearGradient>
    <radialGradient id="shellGlow" cx="0" cy="0" r="1" gradientTransform="translate(728 242) rotate(135) scale(620)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5f62a3" stop-opacity="0.30"/>
      <stop offset="0.58" stop-color="#313342" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#111218" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="upperLayer" x1="215" y1="230" x2="675" y2="770" gradientUnits="userSpaceOnUse">
      <stop stop-color="#444753" stop-opacity="0.95"/>
      <stop offset="0.54" stop-color="#2a2c36" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#1d1f28" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="lowerLayer" x1="804" y1="810" x2="350" y2="256" gradientUnits="userSpaceOnUse">
      <stop stop-color="#343742" stop-opacity="0.98"/>
      <stop offset="0.56" stop-color="#242630" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#1b1d25" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="rim" x1="210" y1="214" x2="794" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d8dbea" stop-opacity="0.62"/>
      <stop offset="0.42" stop-color="#8d91ad" stop-opacity="0.34"/>
      <stop offset="0.70" stop-color="#8981f5" stop-opacity="0.60"/>
      <stop offset="1" stop-color="#4b4e62" stop-opacity="0.56"/>
    </linearGradient>
    <radialGradient id="status" cx="0" cy="0" r="1" gradientTransform="translate(490 480) rotate(45) scale(94)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c9b9ff"/>
      <stop offset="0.52" stop-color="#9e83ff"/>
      <stop offset="1" stop-color="#7658e5"/>
    </radialGradient>
    <filter id="outerShadow" x="-18%" y="-18%" width="136%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#050609" flood-opacity="0.58"/>
    </filter>
    <filter id="layerShadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#050609" flood-opacity="0.40"/>
    </filter>
    <filter id="statusGlow" x="-130%" y="-130%" width="360%" height="360%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="19" flood-color="#8f72ff" flood-opacity="0.66"/>
    </filter>
    <path id="layerShape" d="M280 222H646C719 222 770 271 770 339C770 371 757 399 733 423L464 692C454 702 458 719 472 723L501 731C524 737 532 765 515 782L482 815C464 833 440 842 414 842H280C196 842 134 780 134 696V368C134 284 196 222 280 222Z"/>
  </defs>

  <g filter="url(#outerShadow)">
    <rect x="52" y="52" width="920" height="920" rx="216" fill="url(#shell)"/>
    <rect x="52" y="52" width="920" height="920" rx="216" fill="url(#shellGlow)"/>
    <rect x="65" y="65" width="894" height="894" rx="203" fill="none" stroke="#e3e5ef" stroke-opacity="0.22" stroke-width="12"/>
    <rect x="82" y="82" width="860" height="860" rx="187" fill="none" stroke="#0a0b10" stroke-opacity="0.72" stroke-width="8"/>
  </g>

  <g filter="url(#layerShadow)">
    <use href="#layerShape" fill="url(#upperLayer)" stroke="url(#rim)" stroke-width="15" stroke-linejoin="round"/>
    <use href="#layerShape" transform="rotate(180 512 512)" fill="url(#lowerLayer)" stroke="url(#rim)" stroke-width="15" stroke-linejoin="round"/>
  </g>

  <circle cx="512" cy="512" r="46" fill="#13151c" stroke="#0b0c11" stroke-width="14"/>
  <circle cx="512" cy="512" r="35" fill="url(#status)" filter="url(#statusGlow)"/>
  <circle cx="500" cy="499" r="12" fill="#ffffff" fill-opacity="0.28"/>
</svg>
