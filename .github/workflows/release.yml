name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches:
      - main
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish (for example, v1.2.3)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: keyswitch-production-release
  cancel-in-progress: false

env:
  DEVELOPER_IDENTITY: "Developer ID Application: Mohit Patil (4NWUS8362L)"
  DEVELOPER_TEAM_ID: "4NWUS8362L"
  SPARKLE_ACCOUNT: "com.mohitpatil.keyswitch"
  SPARKLE_PUBLIC_KEY: "k/PEbhkmYphQ7VTC3Pu04v1O7OLxn6ohRXuoxxN/n+Y="

jobs:
  resolve:
    name: Resolve release
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_release: ${{ steps.resolve.outputs.should_release }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      build: ${{ steps.metadata.outputs.build }}
      already_published: ${{ steps.metadata.outputs.already_published }}

    steps:
      - name: Check out release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || (github.event_name == 'workflow_dispatch' && inputs.tag || github.ref) }}

      - name: Verify successful main CI source
        if: github.event_name == 'workflow_run'
        env:
          TESTED_BRANCH: ${{ github.event.workflow_run.head_branch }}
          TESTED_EVENT: ${{ github.event.workflow_run.event }}
          TESTED_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          test "$TESTED_EVENT" = "push"
          test "$TESTED_BRANCH" = "main"
          test "$TESTED_REPOSITORY" = "$GITHUB_REPOSITORY"
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          git fetch origin main
          git merge-base --is-ancestor "$TESTED_SHA" origin/main

      - name: Validate release metadata
        id: metadata
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          set -euo pipefail

          arguments=()
          if [[ -n "$REQUESTED_TAG" ]]; then
            arguments+=(--tag "$REQUESTED_TAG")
          fi
          git fetch origin main
          if [[ -n "$REQUESTED_TAG" ]] && \
             ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Release tag $REQUESTED_TAG is not contained in main." >&2
            exit 1
          fi
          git show origin/main:docs/appcast.xml > "$RUNNER_TEMP/current-appcast.xml"
          Scripts/release_metadata.py "${arguments[@]}" \
            --appcast "$RUNNER_TEMP/current-appcast.xml" \
            --github-output "$GITHUB_OUTPUT"

      - name: Decide whether this tested commit creates a release
        id: resolve
        env:
          ALREADY_PUBLISHED: ${{ steps.metadata.outputs.already_published }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          set -euo pipefail

          source_sha="$(git rev-parse HEAD)"
          should_release=true
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG" || \
               [[ "$ALREADY_PUBLISHED" == "true" ]]; then
              should_release=false
              echo "$RELEASE_TAG already exists; this tested main commit is not a new release."
            fi
          elif [[ "$GITHUB_EVENT_NAME" == "push" && \
                  "$GITHUB_REF_TYPE" == "tag" && \
                  "$ALREADY_PUBLISHED" == "true" ]]; then
            should_release=false
            echo "$RELEASE_TAG is already in the signed update feed."
          fi

          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "should_release=$should_release" >> "$GITHUB_OUTPUT"

  release:
    name: Sign, notarize, and publish
    needs: resolve
    if: needs.resolve.outputs.should_release == 'true'
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      actions: write
      contents: write
      pull-requests: write

    steps:
      - name: Check out validated source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve.outputs.source_sha }}

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Validate release metadata again
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: Scripts/release_metadata.py --tag "$RELEASE_TAG"

      - name: Require release credentials
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          missing=()
          [[ -n "$P12_BASE64" ]] || missing+=(DEVELOPER_ID_P12_BASE64)
          [[ -n "$P12_PASSWORD" ]] || missing+=(DEVELOPER_ID_P12_PASSWORD)
          [[ -n "$ASC_KEY_ID" ]] || missing+=(APP_STORE_CONNECT_KEY_ID)
          [[ -n "$ASC_ISSUER_ID" ]] || missing+=(APP_STORE_CONNECT_ISSUER_ID)
          [[ -n "$ASC_PRIVATE_KEY" ]] || missing+=(APP_STORE_CONNECT_PRIVATE_KEY)
          [[ -n "$SPARKLE_PRIVATE_KEY" ]] || missing+=(SPARKLE_PRIVATE_KEY)

          if (( ${#missing[@]} > 0 )); then
            echo "Missing required GitHub Actions secrets: ${missing[*]}" >&2
            exit 1
          fi

      - name: Run app tests
        run: |
          xcodebuild \
            -project KeySwitch.xcodeproj \
            -scheme KeySwitch \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/KeySwitchTests" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_STRICT_CONCURRENCY=complete \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            test

      - name: Prepare ephemeral code-signing identity
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077

          keychain_path="$RUNNER_TEMP/keyswitch-release.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          p12_path="$RUNNER_TEMP/developer-id.p12"
          original_default_keychain="$(
            security default-keychain -d user |
              sed -e 's/^"//' -e 's/"$//'
          )"

          echo "RELEASE_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
          echo "ORIGINAL_DEFAULT_KEYCHAIN_PATH=$original_default_keychain" >> "$GITHUB_ENV"

          printf '%s' "$P12_BASE64" | /usr/bin/base64 --decode > "$p12_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security list-keychains -d user -s \
            "$keychain_path" \
            "$original_default_keychain"
          security default-keychain -d user -s "$keychain_path"
          security import "$p12_path" \
            -k "$keychain_path" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          unset P12_BASE64 P12_PASSWORD
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path" >/dev/null
          security find-identity -v -p codesigning "$keychain_path" |
            grep -F "$DEVELOPER_IDENTITY"

          /bin/unlink "$p12_path"

      - name: Build Developer ID archive
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
          RELEASE_BUILD: ${{ needs.resolve.outputs.build }}
        run: |
          set -euo pipefail

          archive_path="$RUNNER_TEMP/KeySwitch.xcarchive"
          xcodebuild \
            -project KeySwitch.xcodeproj \
            -scheme KeySwitch \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$archive_path" \
            DEVELOPMENT_TEAM="$DEVELOPER_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$DEVELOPER_IDENTITY" \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            archive

          app_path="$archive_path/Products/Applications/KeySwitch.app"
          plist="$app_path/Contents/Info.plist"
          test -d "$app_path"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" = \
            "$RELEASE_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")" = \
            "$RELEASE_BUILD"
          lipo "$app_path/Contents/MacOS/KeySwitch" -verify_arch arm64 x86_64
          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign -dv --verbose=4 "$app_path" 2>&1 |
            grep -F "TeamIdentifier=$DEVELOPER_TEAM_ID"

          echo "APP_PATH=$app_path" >> "$GITHUB_ENV"

      - name: Notarize and staple app
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077

          asc_key_path="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          cleanup_asc_key() {
            if [[ -e "$asc_key_path" ]]; then
              /bin/unlink "$asc_key_path"
            fi
          }
          trap cleanup_asc_key EXIT
          printf '%s' "$ASC_PRIVATE_KEY" > "$asc_key_path"
          unset ASC_PRIVATE_KEY
          openssl pkey -in "$asc_key_path" -check -noout >/dev/null

          notarization_zip="$RUNNER_TEMP/KeySwitch-notarization.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$notarization_zip"
          xcrun notarytool submit "$notarization_zip" \
            --key "$asc_key_path" \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" \
            --wait
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"

      - name: Install pinned DMG packager
        run: echo "$(Scripts/fetch_create_dmg.sh)" >> "$GITHUB_PATH"

      - name: Create and notarize release artifacts
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          umask 077

          asc_key_path="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          cleanup_asc_key() {
            if [[ -e "$asc_key_path" ]]; then
              /bin/unlink "$asc_key_path"
            fi
          }
          trap cleanup_asc_key EXIT
          printf '%s' "$ASC_PRIVATE_KEY" > "$asc_key_path"
          unset ASC_PRIVATE_KEY
          openssl pkey -in "$asc_key_path" -check -noout >/dev/null

          release_directory="$RUNNER_TEMP/release"
          mkdir -p "$release_directory"
          zip_name="KeySwitch-v${RELEASE_VERSION}-macOS-universal.zip"
          dmg_name="KeySwitch-v${RELEASE_VERSION}-macOS-universal.dmg"
          zip_path="$release_directory/$zip_name"
          dmg_path="$release_directory/$dmg_name"

          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$zip_path"
          (
            cd "$release_directory"
            shasum -a 256 "$zip_name"
          ) > "$zip_path.sha256"

          Scripts/create_release_dmg.sh \
            "$APP_PATH" \
            "$RELEASE_VERSION" \
            "$release_directory"
          codesign --force --timestamp --sign "$DEVELOPER_IDENTITY" "$dmg_path"
          codesign --verify --verbose=2 "$dmg_path"
          xcrun notarytool submit "$dmg_path" \
            --key "$asc_key_path" \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" \
            --wait
          xcrun stapler staple "$dmg_path"
          xcrun stapler validate "$dmg_path"
          codesign --verify --verbose=2 "$dmg_path"
          spctl --assess \
            --type open \
            --context context:primary-signature \
            --verbose=4 \
            "$dmg_path"
          hdiutil verify "$dmg_path"
          (
            cd "$release_directory"
            shasum -a 256 "$dmg_name"
          ) > "$dmg_path.sha256"

          ditto "$dmg_path" "$release_directory/KeySwitch-macOS-universal.dmg"
          ditto "$zip_path" "$release_directory/KeySwitch-macOS-universal.zip"

          echo "RELEASE_DIRECTORY=$release_directory" >> "$GITHUB_ENV"
          echo "RELEASE_ZIP_PATH=$zip_path" >> "$GITHUB_ENV"
          echo "RELEASE_DMG_PATH=$dmg_path" >> "$GITHUB_ENV"

      - name: Remove code-signing identity
        run: |
          set -euo pipefail
          security default-keychain -d user -s "$ORIGINAL_DEFAULT_KEYCHAIN_PATH"
          security list-keychains -d user -s "$ORIGINAL_DEFAULT_KEYCHAIN_PATH"
          security delete-keychain "$RELEASE_KEYCHAIN_PATH"

      - name: Retain release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: KeySwitch-${{ needs.resolve.outputs.version }}
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          retention-days: 14

      - name: Create tag and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          ALREADY_PUBLISHED: ${{ needs.resolve.outputs.already_published }}
        run: |
          set -euo pipefail

          git fetch origin main --tags
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            tagged_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [[ "$tagged_sha" != "$SOURCE_SHA" ]]; then
              echo "Tag $RELEASE_TAG points at $tagged_sha, not $SOURCE_SHA" >&2
              exit 1
            fi
          else
            git tag -a "$RELEASE_TAG" "$SOURCE_SHA" \
              -m "KeySwitch $RELEASE_VERSION"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [[ "$ALREADY_PUBLISHED" == "true" ]]; then
              existing_directory="$RUNNER_TEMP/existing-release"
              mkdir -p "$existing_directory"
              checksum_name="$(basename "$RELEASE_ZIP_PATH.sha256")"
              gh release download "$RELEASE_TAG" \
                --pattern "$checksum_name" \
                --dir "$existing_directory"
              cmp "$existing_directory/$checksum_name" "$RELEASE_ZIP_PATH.sha256" || {
                echo "Published update bytes differ; refusing to invalidate the appcast." >&2
                exit 1
              }
            fi
          else
            release_flags=(
              --verify-tag
              --title "KeySwitch $RELEASE_VERSION"
              --generate-notes
              --draft
            )
            if [[ "$RELEASE_VERSION" == *-* ]]; then
              release_flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "${release_flags[@]}"
          fi

          gh release upload "$RELEASE_TAG" --clobber \
            "$RELEASE_DMG_PATH" \
            "$RELEASE_DMG_PATH.sha256" \
            "$RELEASE_ZIP_PATH" \
            "$RELEASE_ZIP_PATH.sha256" \
            "$RELEASE_DIRECTORY/KeySwitch-macOS-universal.dmg" \
            "$RELEASE_DIRECTORY/KeySwitch-macOS-universal.zip"
          gh release edit "$RELEASE_TAG" --draft=false

      - name: Publish signed Sparkle feed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077

          sparkle_key_path="$RUNNER_TEMP/sparkle-private-key"
          cleanup_sparkle_key() {
            if [[ -e "$sparkle_key_path" ]]; then
              /bin/unlink "$sparkle_key_path"
            fi
            security delete-generic-password \
              -s https://sparkle-project.org \
              -a "$SPARKLE_ACCOUNT" >/dev/null 2>&1 || true
          }
          trap cleanup_sparkle_key EXIT

          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$sparkle_key_path"
          unset SPARKLE_PRIVATE_KEY
          sparkle_tools="$(Scripts/fetch_sparkle_tools.sh)"
          "$sparkle_tools/bin/generate_keys" \
            --account "$SPARKLE_ACCOUNT" \
            -f "$sparkle_key_path" >/dev/null
          imported_public_key="$(
            "$sparkle_tools/bin/generate_keys" \
              --account "$SPARKLE_ACCOUNT" \
              -p
          )"
          test "$imported_public_key" = "$SPARKLE_PUBLIC_KEY"
          /bin/unlink "$sparkle_key_path"

          Scripts/publish_update_feed.sh \
            "$RELEASE_ZIP_PATH" \
            "$RELEASE_VERSION"
          gh workflow run pages.yml --ref main

      - name: Remove ephemeral credentials
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          if [[ -n "${ORIGINAL_DEFAULT_KEYCHAIN_PATH:-}" && \
                -e "$ORIGINAL_DEFAULT_KEYCHAIN_PATH" ]]; then
            security default-keychain -d user \
              -s "$ORIGINAL_DEFAULT_KEYCHAIN_PATH" || true
            security list-keychains -d user \
              -s "$ORIGINAL_DEFAULT_KEYCHAIN_PATH" || true
          fi
          if [[ -n "${RELEASE_KEYCHAIN_PATH:-}" && -e "$RELEASE_KEYCHAIN_PATH" ]]; then
            security delete-keychain "$RELEASE_KEYCHAIN_PATH" || true
          fi
          asc_key_path="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          if [[ -e "$asc_key_path" ]]; then
            /bin/unlink "$asc_key_path" || true
          fi
          if [[ -e "$RUNNER_TEMP/developer-id.p12" ]]; then
            /bin/unlink "$RUNNER_TEMP/developer-id.p12" || true
          fi
          if [[ -e "$RUNNER_TEMP/sparkle-private-key" ]]; then
            /bin/unlink "$RUNNER_TEMP/sparkle-private-key" || true
          fi
          security delete-generic-password \
            -s https://sparkle-project.org \
            -a "$SPARKLE_ACCOUNT" >/dev/null 2>&1 || true
