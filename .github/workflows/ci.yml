name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Run app tests
        run: |
          xcodebuild \
            -project KeySwitch.xcodeproj \
            -scheme KeySwitch \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/KeySwitchDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Build command-line prototype
        run: swift build --configuration debug
