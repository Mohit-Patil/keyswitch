name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan Git history for leaked secrets
        run: Scripts/scan_secrets.sh

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Run app tests
        run: |
          xcodebuild \
            -project KeySwitch.xcodeproj \
            -scheme KeySwitch \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/KeySwitchDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_STRICT_CONCURRENCY=complete \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            test

      - name: Run Xcode static analyzer
        run: |
          xcodebuild \
            -project KeySwitch.xcodeproj \
            -scheme KeySwitch \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/KeySwitchDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_STRICT_CONCURRENCY=complete \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            analyze

      - name: Build command-line prototype
        run: swift build --configuration debug

      - name: Build universal Release app
        run: |
          xcodebuild \
            -project KeySwitch.xcodeproj \
            -scheme KeySwitch \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/KeySwitchRelease" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify Release architecture and metadata
        run: |
          set -euo pipefail

          app="$RUNNER_TEMP/KeySwitchRelease/Build/Products/Release/KeySwitch.app"
          executable="$app/Contents/MacOS/KeySwitch"
          plist="$app/Contents/Info.plist"
          privacy_manifest="$app/Contents/Resources/PrivacyInfo.xcprivacy"

          expected_marketing_version="$(
            xcodebuild -project KeySwitch.xcodeproj -target KeySwitch \
              -configuration Release -showBuildSettings |
              awk -F ' = ' \
                '/^[[:space:]]*MARKETING_VERSION = / && !found { print $2; found=1 }'
          )"
          expected_build_version="$(
            xcodebuild -project KeySwitch.xcodeproj -target KeySwitch \
              -configuration Release -showBuildSettings |
              awk -F ' = ' \
                '/^[[:space:]]*CURRENT_PROJECT_VERSION = / && !found { print $2; found=1 }'
          )"
          actual_marketing_version="$(
            /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist"
          )"
          actual_build_version="$(
            /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist"
          )"

          test -n "$expected_marketing_version"
          test -n "$expected_build_version"
          test "$actual_marketing_version" = "$expected_marketing_version"
          test "$actual_build_version" = "$expected_build_version"
          lipo "$executable" -verify_arch arm64 x86_64
          test -f "$privacy_manifest"
          plutil -lint "$privacy_manifest"

      - name: Verify updater packaging and signed feed metadata
        run: |
          set -euo pipefail

          app="$RUNNER_TEMP/KeySwitchRelease/Build/Products/Release/KeySwitch.app"
          plist="$app/Contents/Info.plist"
          feed="docs/appcast.xml"
          expected_feed_url="https://mohit-patil.github.io/keyswitch/appcast.xml"
          expected_public_key="k/PEbhkmYphQ7VTC3Pu04v1O7OLxn6ohRXuoxxN/n+Y="

          test -d "$app/Contents/Frameworks/Sparkle.framework"
          test -f "$app/Contents/Resources/ThirdPartyNotices.txt"
          test "$(/usr/libexec/PlistBuddy -c 'Print :SUFeedURL' "$plist")" = \
            "$expected_feed_url"
          test "$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "$plist")" = \
            "$expected_public_key"
          test "$(/usr/libexec/PlistBuddy -c 'Print :SURequireSignedFeed' "$plist")" = \
            "true"
          test "$(/usr/libexec/PlistBuddy -c 'Print :SUVerifyUpdateBeforeExtraction' "$plist")" = \
            "true"
          xmllint --noout "$feed"
          grep -Fq '<!-- sparkle-signatures:' "$feed"
          grep -Fq 'edSignature:' "$feed"
          python3 Scripts/changelog_to_html.py \
            CHANGELOG.md 0.1.1 "$RUNNER_TEMP/KeySwitch-0.1.1.html"
          grep -Fq '<h2>KeySwitch 0.1.1</h2>' \
            "$RUNNER_TEMP/KeySwitch-0.1.1.html"
          python3 -m py_compile Scripts/changelog_to_html.py
          python3 -m py_compile Scripts/release_metadata.py
          python3 -m unittest discover -s Scripts/tests
          Scripts/release_metadata.py
          bash -n Scripts/create_release_dmg.sh
          bash -n Scripts/fetch_create_dmg.sh
          bash -n Scripts/fetch_sparkle_tools.sh
          bash -n Scripts/generate_update_appcast.sh
          bash -n Scripts/publish_update_feed.sh
